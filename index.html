<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6757e8">
  <title>顯微鏡操作推盤</title>
  <style>
    :root{--ink:#263156;--muted:#687295;--purple:#6757e8;--purple2:#897df2;--cyan:#36c7ce;--yellow:#ffd564;--pink:#ff7bac;--paper:#fffefa;--shadow:0 18px 50px rgba(52,46,120,.16);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);min-height:100vh;background:radial-gradient(circle at 10% 10%,#fff4ad 0 5%,transparent 22%),radial-gradient(circle at 92% 5%,#d8f9fb 0 8%,transparent 27%),linear-gradient(145deg,#f9f7ff,#eefcff);overflow-x:hidden}
    button,input{font:inherit} button{cursor:pointer} .bubble{position:fixed;border-radius:50%;opacity:.42;filter:blur(1px);z-index:-1;animation:float 8s ease-in-out infinite}.b1{width:120px;height:120px;background:#ff9dc1;left:-38px;top:42%}.b2{width:180px;height:180px;background:#72dee2;right:-70px;bottom:8%;animation-delay:-3s}@keyframes float{50%{transform:translateY(-20px) rotate(8deg)}}
    header{max-width:1100px;margin:auto;padding:28px 24px 16px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),#a46bed);box-shadow:0 10px 25px #6657e844;color:white;font-size:31px;transform:rotate(-3deg)}h1{font-size:clamp(1.55rem,4vw,2.35rem);margin:0;letter-spacing:.04em}.subtitle{margin:3px 0 0;color:var(--muted);font-weight:600}.iconBtn{border:0;border-radius:14px;background:white;color:var(--ink);padding:11px 14px;box-shadow:0 6px 18px #4b43851a;font-weight:800;min-height:46px}.iconBtn:hover{transform:translateY(-2px)}
    main{max-width:1100px;margin:auto;padding:8px 24px 42px;display:grid;grid-template-columns:minmax(300px,610px) minmax(260px,360px);gap:26px;align-items:start}.panel{background:rgba(255,255,255,.86);border:1px solid #fff;border-radius:28px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}.game{padding:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.stat{background:#f4f1ff;border-radius:16px;padding:10px;text-align:center}.stat span{display:block;font-size:.78rem;color:var(--muted);font-weight:800}.stat strong{font-size:1.2rem}.boardWrap{position:relative;background:linear-gradient(145deg,#5145ba,#7869ea);padding:10px;border-radius:24px;box-shadow:inset 0 2px 8px #2f286f66}.board{aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px}.tile{border:0;border-radius:17px;background:linear-gradient(145deg,#fff,#f5f5ff);color:var(--ink);box-shadow:0 7px 0 #d9d5f2,0 10px 16px #29216c44;display:flex;align-items:center;justify-content:center;position:relative;padding:7px;transition:transform .18s,box-shadow .18s;overflow:hidden}.tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:0 9px 0 #d9d5f2,0 13px 20px #29216c55;outline:4px solid #ffdd72}.tile:active{transform:translateY(3px);box-shadow:0 3px 0 #d9d5f2}.tile .num{position:absolute;top:7px;left:8px;width:28px;height:28px;border-radius:9px;background:var(--purple);color:white;display:grid;place-items:center;font-size:.92rem;font-weight:900}.tile .art{font-size:clamp(2.1rem,7vw,4.6rem);line-height:1;filter:drop-shadow(0 5px 3px #5d539933)}.tile .label{position:absolute;bottom:7px;left:5px;right:5px;text-align:center;font-size:clamp(.7rem,1.7vw,.95rem);font-weight:900;background:#ffffffd9;border-radius:8px;padding:3px}.tile.empty{background:#463ba5;box-shadow:inset 0 5px 12px #2c2671;pointer-events:none}.tile.movable{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{filter:brightness(1.06);transform:scale(.975)}}.winGlow{animation:win .65s ease 2}@keyframes win{50%{filter:brightness(1.2);transform:scale(1.015)}}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.btn{border:0;border-radius:15px;padding:13px 12px;font-weight:900;min-height:50px;transition:.18s}.btn:hover{transform:translateY(-2px)}.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:white;box-shadow:0 8px 18px #6757e84a}.secondary{background:#eef0ff;color:#4b4693}.hint{font-size:.9rem;color:var(--muted);margin:13px 2px 0;text-align:center;font-weight:600}
    aside{display:grid;gap:18px}.card{padding:20px}.card h2{font-size:1.18rem;margin:0 0 13px;display:flex;align-items:center;gap:8px}.steps{display:grid;gap:9px}.step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;background:#f7f8ff;padding:9px;border-radius:13px;font-weight:700;font-size:.95rem}.step b{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#dff7f7;font-size:1.15rem}.ranking{margin:0;padding:0;list-style:none;display:grid;gap:7px}.ranking li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;padding:9px;border-radius:11px;background:#fff7df;align-items:center;font-weight:750}.ranking small{color:var(--muted)}.emptyRank{text-align:center;color:var(--muted);padding:16px 5px}.tip{background:linear-gradient(135deg,#fff1b9,#ffdff0);border-radius:15px;padding:13px;font-weight:700;line-height:1.55}
    dialog{border:0;border-radius:25px;padding:0;max-width:420px;width:calc(100% - 32px);box-shadow:0 30px 90px #24204966;color:var(--ink)}dialog::backdrop{background:#28215399;backdrop-filter:blur(5px)}.modal{padding:28px;text-align:center}.modal .trophy{font-size:4rem}.modal h2{font-size:1.65rem;margin:4px}.modal p{color:var(--muted);font-weight:650}.modal input{width:100%;border:2px solid #dcd9f7;border-radius:13px;padding:12px;margin:8px 0 13px;font-size:1rem}.modal .btn{width:100%}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#25204d;color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:0 10px 30px #0004;transition:.3s;z-index:10}.toast.show{transform:translate(-50%,0)}
    @media(max-width:780px){header{padding:18px 16px 10px}.subtitle{font-size:.85rem}main{grid-template-columns:1fr;padding:6px 14px 30px;gap:18px}.game{padding:15px}.panel{border-radius:22px}.board{gap:6px}.boardWrap{padding:7px;border-radius:20px}.tile{border-radius:14px}.card{padding:17px}.steps{grid-template-columns:1fr 1fr}.step{font-size:.84rem}}
    @media(max-width:430px){.logo{width:49px;height:49px}.iconBtn .soundText{display:none}.stats{gap:6px}.stat{padding:8px 4px}.stat strong{font-size:1.05rem}.steps{grid-template-columns:1fr}.tile .label{font-size:.66rem}.tile .num{width:24px;height:24px;font-size:.8rem}.controls{grid-template-columns:1fr 1fr}.btn{padding:11px 7px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="bubble b1"></div><div class="bubble b2"></div>
  <header><div class="brand"><div class="logo" aria-hidden="true">🔬</div><div><h1>顯微鏡操作推盤</h1><p class="subtitle">拼出正確步驟，成為觀察小達人！</p></div></div><button class="iconBtn" id="soundBtn" aria-pressed="true" title="切換音效">🔊 <span class="soundText">音效開啟</span></button></header>
  <main>
    <section class="panel game" aria-label="推盤遊戲區">
      <div class="stats"><div class="stat"><span>移動步數</span><strong id="moves">0</strong></div><div class="stat"><span>經過時間</span><strong id="time">00:00</strong></div><div class="stat"><span>目前分數</span><strong id="score">1000</strong></div></div>
      <div class="boardWrap"><div class="board" id="board" role="grid" aria-label="三乘三顯微鏡操作推盤"></div></div>
      <div class="controls"><button class="btn primary" id="shuffleBtn">🔀 重新洗牌</button><button class="btn secondary" id="undoBtn" disabled>↩ 復原一步</button></div>
      <p class="hint">點擊空格旁的圖塊，或使用鍵盤方向鍵移動</p>
    </section>
    <aside>
      <section class="panel card"><h2>🧪 正確操作順序</h2><div class="steps" id="steps"></div></section>
      <section class="panel card"><h2>🏆 本機排行榜</h2><ol class="ranking" id="ranking"></ol></section>
      <section class="panel card"><h2>💡 小提示</h2><div class="tip" id="tip">先找出「放置玻片」，再把相鄰步驟慢慢接起來。每少一步，分數就更高！</div></section>
    </aside>
  </main>
  <dialog id="winDialog"><div class="modal"><div class="trophy">🏆</div><h2>操作完成！</h2><p id="winSummary"></p><input id="playerName" maxlength="12" placeholder="輸入你的名字" aria-label="玩家名字"><button class="btn primary" id="saveScore">儲存成績並再玩一次</button></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const items=[
      {id:1,icon:'🧫',label:'放置玻片'},{id:2,icon:'🔩',label:'轉低倍鏡頭'},{id:3,icon:'💡',label:'調整光源'},{id:4,icon:'👁️',label:'側看降鏡筒'},
      {id:5,icon:'🔭',label:'目鏡中觀察'},{id:6,icon:'⚙️',label:'粗調焦距'},{id:7,icon:'✨',label:'微調清晰'},{id:8,icon:'📝',label:'記錄結果'}];
    const solved=[1,2,3,4,5,6,7,8,0]; let state=[...solved],history=[],moves=0,seconds=0,timer=null,started=false,sound=true,locked=false;
    const $=s=>document.querySelector(s),board=$('#board'),movesEl=$('#moves'),timeEl=$('#time'),scoreEl=$('#score');
    function render(){board.innerHTML='';const empty=state.indexOf(0);state.forEach((id,i)=>{const b=document.createElement('button');b.className='tile'+(id===0?' empty':'')+(id&&adjacent(i,empty)?' movable':'');b.setAttribute('role','gridcell');if(!id){b.setAttribute('aria-label','空格');b.tabIndex=-1}else{const it=items[id-1];b.setAttribute('aria-label',`第 ${id} 步：${it.label}`);b.innerHTML=`<span class="num">${id}</span><span class="art" aria-hidden="true">${it.icon}</span><span class="label">${it.label}</span>`;b.onclick=()=>move(i)}board.appendChild(b)});movesEl.textContent=moves;scoreEl.textContent=calcScore();$('#undoBtn').disabled=!history.length||locked}
    function adjacent(a,b){return Math.abs(a-b)===3||(Math.floor(a/3)===Math.floor(b/3)&&Math.abs(a-b)===1)}
    function move(i,fromUndo=false){if(locked)return;const e=state.indexOf(0);if(!adjacent(i,e)){tone(130,'sawtooth',.06);showToast('只能移動空格旁邊的圖塊喔！');return}if(!started)startTimer();if(!fromUndo)history.push([...state]);[state[i],state[e]]=[state[e],state[i]];moves++;tone(360,'sine',.055);render();if(state.every((v,j)=>v===solved[j]))win()}
    function shuffle(){clearInterval(timer);timer=null;seconds=0;moves=0;history=[];started=false;locked=false;state=[...solved];let last=-1;for(let k=0;k<100;k++){const e=state.indexOf(0),choices=state.map((_,i)=>i).filter(i=>adjacent(i,e)&&i!==last),pick=choices[Math.floor(Math.random()*choices.length)];last=e;[state[pick],state[e]]=[state[e],state[pick]]}if(state.every((v,i)=>v===solved[i]))return shuffle();updateTime();render();tone(500,'triangle',.09);showToast('新題目準備好了！')}
    function undo(){if(!history.length||locked)return;state=history.pop();moves=Math.max(0,moves-1);tone(260,'sine',.07);render();showToast('已復原一步')}
    function startTimer(){started=true;timer=setInterval(()=>{seconds++;updateTime();scoreEl.textContent=calcScore()},1000)}
    function updateTime(){timeEl.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
    function calcScore(){return Math.max(100,1000-moves*12-seconds*2)}
    function win(){locked=true;clearInterval(timer);timer=null;render();board.classList.add('winGlow');setTimeout(()=>board.classList.remove('winGlow'),1400);melody();$('#winSummary').textContent=`你用了 ${moves} 步、${timeEl.textContent}，獲得 ${calcScore()} 分！`;setTimeout(()=>$('#winDialog').showModal(),500)}
    function ranks(){try{return JSON.parse(localStorage.getItem('microRanks')||'[]')}catch{return[]}}
    function showRanks(){const r=ranks(),el=$('#ranking');el.innerHTML=r.length?r.map((x,i)=>`<li><b>${['🥇','🥈','🥉'][i]||i+1}</b><span>${escapeHtml(x.name)}<br><small>${x.moves} 步・${x.time}</small></span><strong>${x.score}</strong></li>`).join(''):'<div class="emptyRank">尚無紀錄，第一名等你來挑戰！</div>'}
    function save(){const name=$('#playerName').value.trim()||'觀察家';const r=ranks();r.push({name,score:calcScore(),moves,time:timeEl.textContent,date:Date.now()});r.sort((a,b)=>b.score-a.score||a.moves-b.moves);localStorage.setItem('microRanks',JSON.stringify(r.slice(0,5)));$('#winDialog').close();$('#playerName').value='';showRanks();shuffle()}
    function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    let audioCtx;function tone(freq,type='sine',dur=.08,delay=0){if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.12,audioCtx.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+dur);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur+.02)}catch{}}
    function melody(){[523,659,784,1047].forEach((f,i)=>tone(f,'triangle',.18,i*.12))}
    let toastTimer;function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1700)}
    $('#shuffleBtn').onclick=shuffle;$('#undoBtn').onclick=undo;$('#saveScore').onclick=save;$('#soundBtn').onclick=()=>{sound=!sound;$('#soundBtn').setAttribute('aria-pressed',sound);$('#soundBtn').innerHTML=`${sound?'🔊':'🔇'} <span class="soundText">音效${sound?'開啟':'關閉'}</span>`;if(sound)tone(600)};
    document.addEventListener('keydown',e=>{if($('#winDialog').open)return;const pos=state.indexOf(0),map={ArrowUp:pos+3,ArrowDown:pos-3,ArrowLeft:pos+1,ArrowRight:pos-1};if(e.key in map&&map[e.key]>=0&&map[e.key]<9){e.preventDefault();move(map[e.key])}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}});
    $('#steps').innerHTML=items.map(x=>`<div class="step"><b>${x.icon}</b><span>${x.id}. ${x.label}</span></div>`).join('');showRanks();shuffle();
  </script>
</body>
</html>
