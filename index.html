<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>顯微鏡操作推盤</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdfa; /* Tailwind teal-50 */
            background-image: 
                radial-gradient(at 0% 0%, hsla(188,100%,78%,1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(289,100%,81%,1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(355,100%,83%,1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(166,100%,78%,1) 0px, transparent 50%);
            min-height: 100vh;
            touch-action: manipulation;
        }

        /* Puzzle Board and Tiles */
        #puzzle-board {
            touch-action: none; /* Prevent scrolling when dragging/tapping puzzle */
        }
        
        .tile {
            position: absolute;
            width: calc(100% / 3);
            height: calc(100% / 3);
            transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            padding: 4px;
        }

        .tile-inner {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06), inset 0 -4px 0 rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            border: 2px solid #5eead4; /* teal-300 */
            transition: background-color 0.2s, transform 0.1s;
        }

        .tile-inner:active {
            transform: translateY(2px);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1), inset 0 -2px 0 rgba(0,0,0,0.1);
        }

        .tile-correct .tile-inner {
            border-color: #34d399; /* emerald-400 */
            background-color: #ecfdf5; /* emerald-50 */
        }

        /* Modal Transitions */
        .modal-enter { opacity: 0; transform: scale(0.9); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 300ms, transform 300ms; }
        .modal-leave { opacity: 1; transform: scale(1); }
        .modal-leave-active { opacity: 0; transform: scale(0.9); transition: opacity 300ms, transform 300ms; }

        /* Custom Scrollbar for Leaderboard */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800 flex flex-col items-center py-6 px-4 md:px-8">

    <div class="max-w-lg w-full flex flex-col gap-6 relative z-10">
        
        <!-- Header -->
        <header class="text-center bg-white/80 backdrop-blur-md rounded-2xl p-4 shadow-lg border border-white">
            <h1 class="text-3xl md:text-4xl font-black text-teal-600 flex items-center justify-center gap-3 drop-shadow-sm">
                <i class="ph ph-microscope text-5xl"></i>
                顯微鏡操作推盤
            </h1>
            <p class="mt-2 text-gray-600 font-medium text-sm md:text-base">
                請依序排列顯微鏡的操作步驟，將數字 1 到 8 排整齊！
            </p>
        </header>

        <!-- Dashboard (Stats & Controls) -->
        <div class="bg-white/80 backdrop-blur-md rounded-2xl p-4 shadow-lg border border-white flex flex-col gap-4">
            
            <div class="flex justify-between items-center px-2">
                <div class="flex flex-col">
                    <span class="text-xs text-gray-500 font-bold uppercase">移動步數</span>
                    <span id="move-count" class="text-2xl font-black text-teal-500">0</span>
                </div>
                <div class="flex flex-col text-right">
                    <span class="text-xs text-gray-500 font-bold uppercase">花費時間</span>
                    <span id="timer-display" class="text-2xl font-black text-indigo-500">00:00</span>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-2">
                <button onclick="undoMove()" id="btn-undo" class="col-span-1 flex flex-col items-center justify-center py-2 bg-yellow-100 text-yellow-700 rounded-xl hover:bg-yellow-200 active:bg-yellow-300 transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i class="ph-bold ph-arrow-u-up-left text-xl"></i>
                    <span class="text-xs font-bold mt-1">復原</span>
                </button>
                <button onclick="startGame()" class="col-span-2 flex items-center justify-center gap-2 py-2 bg-gradient-to-r from-teal-400 to-emerald-400 text-white rounded-xl hover:from-teal-500 hover:to-emerald-500 active:scale-95 transition shadow-md font-bold text-lg">
                    <i class="ph-fill ph-play-circle text-2xl"></i>
                    重新開始
                </button>
                <button onclick="showLeaderboard()" class="col-span-1 flex flex-col items-center justify-center py-2 bg-purple-100 text-purple-700 rounded-xl hover:bg-purple-200 active:bg-purple-300 transition shadow-sm">
                    <i class="ph-bold ph-trophy text-xl"></i>
                    <span class="text-xs font-bold mt-1">排行</span>
                </button>
            </div>
        </div>

        <!-- Game Board -->
        <div class="relative w-full aspect-square bg-teal-900/10 rounded-2xl shadow-inner border-4 border-white/50 p-1">
            <div id="puzzle-board" class="w-full h-full relative overflow-hidden rounded-xl">
                <!-- Tiles will be injected here by JavaScript -->
            </div>
            
            <!-- Overlay before start -->
            <div id="start-overlay" class="absolute inset-0 z-20 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center rounded-xl transition-opacity duration-300">
                <button onclick="startGame()" class="animate-bounce bg-teal-500 hover:bg-teal-600 text-white text-xl font-bold py-4 px-8 rounded-full shadow-xl flex items-center gap-2 transition-transform hover:scale-105 active:scale-95">
                    <i class="ph-fill ph-play text-2xl"></i>
                    開始遊戲
                </button>
                <p class="mt-4 text-teal-800 font-bold bg-teal-100 px-4 py-1 rounded-full text-sm">點擊按鈕開始並啟用音效</p>
            </div>
        </div>
        
        <!-- Legend (Instructions for the theme) -->
        <div class="bg-white/60 rounded-xl p-3 text-xs md:text-sm text-gray-700 grid grid-cols-2 md:grid-cols-4 gap-2">
            <div class="flex items-center gap-1"><span class="font-bold text-teal-600">1.</span>🔬 取鏡準備</div>
            <div class="flex items-center gap-1"><span class="font-bold text-teal-600">2.</span>💡 開啟光源</div>
            <div class="flex items-center gap-1"><span class="font-bold text-teal-600">3.</span>🧫 放載玻片</div>
            <div class="flex items-center gap-1"><span class="font-bold text-teal-600">4.</span>👁️ 低倍觀察</div>
            <div class="flex items-center gap-1"><span class="font-bold text-teal-600">5.</span>⚙️ 粗調節輪</div>
            <div class="flex items-center gap-1"><span class="font-bold text-teal-600">6.</span>🔍 轉高倍鏡</div>
            <div class="flex items-center gap-1"><span class="font-bold text-teal-600">7.</span>🔧 細調節輪</div>
            <div class="flex items-center gap-1"><span class="font-bold text-teal-600">8.</span>📝 記錄結果</div>
        </div>

    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl transform scale-90 transition-transform duration-300 flex flex-col items-center text-center" id="win-modal-content">
            <div class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mb-4">
                <i class="ph-fill ph-confetti text-5xl text-yellow-500"></i>
            </div>
            <h2 class="text-3xl font-black text-teal-600 mb-2">過關了！</h2>
            <p class="text-gray-600 mb-6 font-medium">你成功完成了顯微鏡操作步驟！</p>
            
            <div class="grid grid-cols-2 gap-4 w-full mb-6 bg-gray-50 rounded-xl p-4 border border-gray-100">
                <div>
                    <div class="text-xs text-gray-500 font-bold mb-1">步數</div>
                    <div class="text-2xl font-black text-teal-500" id="win-moves">0</div>
                </div>
                <div>
                    <div class="text-xs text-gray-500 font-bold mb-1">時間</div>
                    <div class="text-2xl font-black text-indigo-500" id="win-time">00:00</div>
                </div>
            </div>

            <div class="w-full mb-6">
                <label class="block text-left text-sm font-bold text-gray-700 mb-2">請輸入您的名字留念：</label>
                <input type="text" id="player-name" placeholder="例如：顯微鏡大師" class="w-full bg-gray-100 border border-gray-300 text-gray-900 text-lg rounded-xl focus:ring-teal-500 focus:border-teal-500 block p-3 font-bold text-center outline-none">
            </div>

            <div class="flex gap-3 w-full">
                <button onclick="closeWinModal()" class="flex-1 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300 transition">關閉</button>
                <button onclick="saveScoreAndRestart()" class="flex-1 py-3 bg-teal-500 text-white rounded-xl font-bold hover:bg-teal-600 transition shadow-md">儲存並重玩</button>
            </div>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboard-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full mx-4 shadow-2xl transform scale-90 transition-transform duration-300 flex flex-col h-[70vh]" id="leaderboard-modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black text-purple-600 flex items-center gap-2">
                    <i class="ph-fill ph-trophy text-3xl"></i>
                    排行榜
                </h2>
                <button onclick="closeLeaderboard()" class="text-gray-400 hover:text-gray-600 transition bg-gray-100 hover:bg-gray-200 rounded-full p-2">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto pr-2" id="leaderboard-list">
                <!-- Leaderboard items injected here -->
            </div>
            
            <div class="mt-4 pt-4 border-t border-gray-100">
                <button onclick="closeLeaderboard()" class="w-full py-3 bg-purple-100 text-purple-700 rounded-xl font-bold hover:bg-purple-200 transition">返回遊戲</button>
            </div>
        </div>
    </div>

    <script>
        // Game State
        const GRID_SIZE = 3;
        const TOTAL_TILES = GRID_SIZE * GRID_SIZE;
        let board = [];
        let emptyIndex = 8;
        let isPlaying = false;
        let moves = 0;
        let history = [];
        
        // Timer
        let startTime;
        let timerInterval;
        let elapsedSeconds = 0;

        // Sound Context (Tone.js)
        let slideSynth;
        let undoSynth;
        let winSynth;
        let errorSynth;
        let audioInitialized = false;

        // Tile Data (Microscope Theme)
        const TILE_DATA = {
            1: { icon: '🔬', text: '準備', desc: '取鏡準備' },
            2: { icon: '💡', text: '開燈', desc: '開啟光源' },
            3: { icon: '🧫', text: '放片', desc: '放載玻片' },
            4: { icon: '👁️', text: '低倍', desc: '低倍觀察' },
            5: { icon: '⚙️', text: '粗調', desc: '粗調節輪' },
            6: { icon: '🔍', text: '高倍', desc: '轉高倍鏡' },
            7: { icon: '🔧', text: '細調', desc: '細調節輪' },
            8: { icon: '📝', text: '記錄', desc: '記錄結果' }
        };

        // DOM Elements
        const boardEl = document.getElementById('puzzle-board');
        const moveCountEl = document.getElementById('move-count');
        const timerDisplayEl = document.getElementById('timer-display');
        const btnUndo = document.getElementById('btn-undo');
        const overlay = document.getElementById('start-overlay');

        async function initAudio() {
            if (audioInitialized) return;
            await Tone.start();
            
            // Membrane synth for sliding (woody/plop sound)
            slideSynth = new Tone.MembraneSynth({
                pitchDecay: 0.05,
                octaves: 2,
                oscillator: { type: "sine" },
                envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.1 }
            }).toDestination();
            slideSynth.volume.value = -10;

            // Membrane synth for undo (lower pitch)
            undoSynth = new Tone.MembraneSynth({
                pitchDecay: 0.1,
                octaves: 1.5,
                oscillator: { type: "triangle" },
                envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.1 }
            }).toDestination();
            undoSynth.volume.value = -10;

            // PolySynth for winning chord
            winSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.05, decay: 0.1, sustain: 0.3, release: 1 }
            }).toDestination();
            winSynth.volume.value = -8;
            
            // Error sound
            errorSynth = new Tone.NoiseSynth({
                noise: { type: "pink" },
                envelope: { attack: 0.005, decay: 0.1, sustain: 0 }
            }).toDestination();
            errorSynth.volume.value = -15;

            audioInitialized = true;
        }

        function playSound(type) {
            if (!audioInitialized) return;
            switch(type) {
                case 'slide': slideSynth.triggerAttackRelease("C4", "16n"); break;
                case 'undo': undoSynth.triggerAttackRelease("G2", "16n"); break;
                case 'win': 
                    const now = Tone.now();
                    winSynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "2n", now); 
                    winSynth.triggerAttackRelease(["F4", "A4", "C5", "F5"], "2n", now + 0.3);
                    winSynth.triggerAttackRelease(["G4", "B4", "D5", "G5"], "2n", now + 0.6);
                    winSynth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "1n", now + 0.9);
                    break;
                case 'error': errorSynth.triggerAttackRelease("32n"); break;
            }
        }

        function createBoard() {
            boardEl.innerHTML = '';
            for (let i = 1; i < TOTAL_TILES; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.id = `tile-${i}`;
                
                const data = TILE_DATA[i];
                
                tile.innerHTML = `
                    <div class="tile-inner">
                        <div class="absolute top-1 left-2 text-xs font-bold text-teal-300">${i}</div>
                        <div class="text-4xl md:text-5xl mb-1">${data.icon}</div>
                        <div class="text-sm md:text-base font-black text-teal-800">${data.text}</div>
                    </div>
                `;
                
                // Add touch and click events
                tile.addEventListener('mousedown', (e) => handleInteraction(e, i));
                tile.addEventListener('touchstart', (e) => {
                    e.preventDefault(); // Prevent double firing
                    handleInteraction(e, i);
                }, { passive: false });
                
                boardEl.appendChild(tile);
            }
        }

        function updateBoardVisuals() {
            board.forEach((tileNumber, index) => {
                if (tileNumber === 0) return;
                
                const tileEl = document.getElementById(`tile-${tileNumber}`);
                const col = index % GRID_SIZE;
                const row = Math.floor(index / GRID_SIZE);
                
                // Use transform for smooth CSS transitions
                tileEl.style.transform = `translate(${col * 100}%, ${row * 100}%)`;

                // Highlight if in correct position
                if (tileNumber === index + 1) {
                    tileEl.classList.add('tile-correct');
                } else {
                    tileEl.classList.remove('tile-correct');
                }
            });
            
            // Update UI Counters
            moveCountEl.innerText = moves;
            btnUndo.disabled = history.length === 0 || !isPlaying;
        }

        function getValidMoves(emptyIdx) {
            const moves = [];
            const col = emptyIdx % GRID_SIZE;
            const row = Math.floor(emptyIdx / GRID_SIZE);
            
            if (row > 0) moves.push(emptyIdx - GRID_SIZE); // Up
            if (row < GRID_SIZE - 1) moves.push(emptyIdx + GRID_SIZE); // Down
            if (col > 0) moves.push(emptyIdx - 1); // Left
            if (col < GRID_SIZE - 1) moves.push(emptyIdx + 1); // Right
            
            return moves;
        }

        function handleInteraction(e, tileNumber) {
            if (!isPlaying) return;
            const tileIndex = board.indexOf(tileNumber);
            const validMoves = getValidMoves(emptyIndex);
            
            if (validMoves.includes(tileIndex)) {
                // Valid Move
                saveState();
                swapTiles(tileIndex, emptyIndex);
                moves++;
                playSound('slide');
                updateBoardVisuals();
                checkWinCondition();
            } else {
                playSound('error');
            }
        }

        function swapTiles(idx1, idx2) {
            const temp = board[idx1];
            board[idx1] = board[idx2];
            board[idx2] = temp;
            emptyIndex = board.indexOf(0);
        }

        function saveState() {
            history.push({
                board: [...board],
                emptyIndex: emptyIndex,
                moves: moves
            });
        }

        function undoMove() {
            if (history.length === 0 || !isPlaying) return;
            const previousState = history.pop();
            board = previousState.board;
            emptyIndex = previousState.emptyIndex;
            moves = previousState.moves;
            playSound('undo');
            updateBoardVisuals();
        }

        function shuffleBoard() {
            // Start solved
            board = [1, 2, 3, 4, 5, 6, 7, 8, 0];
            emptyIndex = 8;
            
            // Simulate random moves to ensure solvability
            let previousEmpty = -1;
            for (let i = 0; i < 150; i++) {
                const validMoves = getValidMoves(emptyIndex);
                // Filter out the move that just reverses the last step
                const allowedMoves = validMoves.filter(idx => idx !== previousEmpty);
                const randomMove = allowedMoves[Math.floor(Math.random() * allowedMoves.length)];
                
                previousEmpty = emptyIndex;
                swapTiles(randomMove, emptyIndex);
            }
        }

        function checkWinCondition() {
            // Winning state: 1, 2, 3, 4, 5, 6, 7, 8, 0
            for (let i = 0; i < TOTAL_TILES - 1; i++) {
                if (board[i] !== i + 1) return false;
            }
            if (board[TOTAL_TILES - 1] !== 0) return false;

            // Win!
            endGame();
            return true;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            elapsedSeconds = 0;
            timerDisplayEl.innerText = "00:00";
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                timerDisplayEl.innerText = formatTime(elapsedSeconds);
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        async function startGame() {
            await initAudio();
            overlay.classList.add('opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 300);
            
            shuffleBoard();
            moves = 0;
            history = [];
            isPlaying = true;
            
            updateBoardVisuals();
            startTimer();
        }

        function endGame() {
            isPlaying = false;
            stopTimer();
            playSound('win');
            
            // Show Win Modal
            document.getElementById('win-moves').innerText = moves;
            document.getElementById('win-time').innerText = formatTime(elapsedSeconds);
            const modal = document.getElementById('win-modal');
            const content = document.getElementById('win-modal-content');
            
            modal.classList.remove('hidden');
            // Trigger reflow for animation
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-90');
        }

        function closeWinModal() {
            const modal = document.getElementById('win-modal');
            const content = document.getElementById('win-modal-content');
            
            modal.classList.add('opacity-0');
            content.classList.add('scale-90');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function saveScoreAndRestart() {
            const nameInput = document.getElementById('player-name').value.trim();
            const playerName = nameInput || "匿名專家";
            
            const score = {
                name: playerName,
                moves: moves,
                time: elapsedSeconds,
                date: new Date().toLocaleDateString()
            };

            let leaderboard = JSON.parse(localStorage.getItem('microscopePuzzleLeaderboard')) || [];
            leaderboard.push(score);
            
            // Sort by moves ascending, then time ascending
            leaderboard.sort((a, b) => {
                if (a.moves === b.moves) {
                    return a.time - b.time;
                }
                return a.moves - b.moves;
            });
            
            // Keep top 10
            leaderboard = leaderboard.slice(0, 10);
            localStorage.setItem('microscopePuzzleLeaderboard', JSON.stringify(leaderboard));
            
            closeWinModal();
            showLeaderboard();
        }

        function showLeaderboard() {
            const modal = document.getElementById('leaderboard-modal');
            const content = document.getElementById('leaderboard-modal-content');
            const listEl = document.getElementById('leaderboard-list');
            
            let leaderboard = JSON.parse(localStorage.getItem('microscopePuzzleLeaderboard')) || [];
            
            listEl.innerHTML = '';
            
            if (leaderboard.length === 0) {
                listEl.innerHTML = `<div class="text-center text-gray-500 mt-10">目前還沒有紀錄，趕快成為第一名吧！</div>`;
            } else {
                leaderboard.forEach((entry, index) => {
                    let rankIcon = `<div class="w-8 h-8 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center font-bold text-sm">${index + 1}</div>`;
                    if (index === 0) rankIcon = `<div class="w-8 h-8 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center font-bold"><i class="ph-fill ph-trophy"></i></div>`;
                    if (index === 1) rankIcon = `<div class="w-8 h-8 rounded-full bg-gray-300 text-gray-700 flex items-center justify-center font-bold"><i class="ph-fill ph-medal"></i></div>`;
                    if (index === 2) rankIcon = `<div class="w-8 h-8 rounded-full bg-amber-200 text-amber-800 flex items-center justify-center font-bold"><i class="ph-fill ph-medal"></i></div>`;

                    listEl.innerHTML += `
                        <div class="flex items-center justify-between p-3 mb-2 bg-gray-50 rounded-xl border border-gray-100 hover:bg-gray-100 transition">
                            <div class="flex items-center gap-3">
                                ${rankIcon}
                                <div>
                                    <div class="font-bold text-gray-800">${entry.name}</div>
                                    <div class="text-xs text-gray-500">${entry.date}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-black text-teal-600">${entry.moves} 步</div>
                                <div class="text-xs text-indigo-500">${formatTime(entry.time)}</div>
                            </div>
                        </div>
                    `;
                });
            }

            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-90');
        }

        function closeLeaderboard() {
            const modal = document.getElementById('leaderboard-modal');
            const content = document.getElementById('leaderboard-modal-content');
            
            modal.classList.add('opacity-0');
            content.classList.add('scale-90');
            setTimeout(() => modal.classList.add('hidden'), 300);

            // If game is not playing and overlay is hidden, it means user just finished a game. Let's show overlay again or auto-restart.
            if (!isPlaying && overlay.classList.contains('hidden')) {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                board = [1, 2, 3, 4, 5, 6, 7, 8, 0];
                updateBoardVisuals();
                moveCountEl.innerText = "0";
                timerDisplayEl.innerText = "00:00";
            }
        }

        window.onload = () => {
            createBoard();
            // Initial dummy board state just for background visual
            board = [1, 2, 3, 4, 5, 6, 7, 8, 0]; 
            updateBoardVisuals();
        };

    </script>
</body>
</html>
